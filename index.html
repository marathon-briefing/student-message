<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1b2a">
<title>學員訊息</title>
<style>
  :root{
    --bg:#f0f3f7; --card:#ffffff; --ink:#1c2b3a; --sub:#5c6b7a;
    --accent:#c9a227; --accent-soft:#f5ecd7; --ok:#1f8a4c; --pending:#b06000;
    --line:#e3e8ee; --radius:18px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif;}
  body{min-height:100vh;}
  .wrap{max-width:540px; margin:0 auto; padding:0 16px calc(env(safe-area-inset-bottom) + 32px);}

  header{background:linear-gradient(160deg,#0d1b2a 0%,#1b3a5c 100%); color:#fff;
    padding:28px 20px 22px; border-bottom-left-radius:22px; border-bottom-right-radius:22px;
    box-shadow:0 6px 18px rgba(0,0,0,.25);}
  header .logo{display:flex; align-items:center; gap:10px;}
  header .logo img{width:44px; height:44px; border-radius:50%; object-fit:contain;
    background:#fff; padding:3px;}
  header .logo .name{font-weight:800; letter-spacing:2px; font-size:15px;}
  header h1{margin:14px 0 4px; font-size:22px; font-weight:800;}
  header p{margin:0; font-size:14px; color:#c6d4e4; line-height:1.5;}
  .who{display:inline-block; margin-top:10px; background:rgba(255,255,255,.14);
    border-radius:20px; padding:5px 14px; font-size:14px; font-weight:700;}

  .card{background:var(--card); border-radius:var(--radius); margin-top:16px;
    padding:18px 16px; box-shadow:0 3px 12px rgba(0,0,0,.08);}
  .card h2{margin:0 0 12px; font-size:16px; font-weight:800; display:flex; align-items:center; gap:8px;}
  .card h2 .dot{width:8px; height:8px; border-radius:50%; background:var(--accent);}

  /* 分類卡 */
  .cats{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .cat{border:1.5px solid var(--line); border-radius:14px; padding:12px; background:#fff;
    text-align:left; cursor:pointer; transition:border-color .15s, background .15s;}
  .cat .t{font-size:14.5px; font-weight:800;}
  .cat .s{font-size:11.5px; color:var(--sub); margin-top:3px; line-height:1.4;}
  .cat.sel{border-color:var(--accent); background:var(--accent-soft);}

  /* 表單 */
  .form-field{margin-top:12px;}
  .form-field label{display:block; font-size:13px; font-weight:700; color:var(--sub); margin-bottom:5px;}
  .form-field select,.form-field input,.form-field textarea{width:100%; border:1.5px solid var(--line);
    border-radius:12px; padding:10px; font-size:14px; font-family:inherit; color:var(--ink); background:#fff;}
  .form-field select:focus,.form-field input:focus,.form-field textarea:focus{outline:none; border-color:var(--accent);}
  .form-field textarea{min-height:64px; resize:vertical;}
  .two{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .pain-row{display:flex; align-items:center; gap:10px;}
  .pain-row input[type=range]{flex:1;}
  .pain-row .pv{font-size:15px; font-weight:800; min-width:34px; text-align:center;}

  .send{width:100%; margin-top:16px; border:none; border-radius:12px; padding:13px;
    font-size:15px; font-weight:800; color:#fff; background:linear-gradient(135deg,#1f8a4c,#15703e);
    cursor:pointer; letter-spacing:1px;}
  .send:disabled{opacity:.5;}
  .toast{display:none; margin-top:12px; border-radius:14px; padding:12px 14px; font-size:14px; font-weight:700;}
  .toast.ok{display:block; background:#e7f5ec; color:var(--ok);}
  .toast.err{display:block; background:#fdeaea; color:#b03030;}
  .note{font-size:12px; color:var(--sub); margin-top:10px; line-height:1.5;}

  /* 對話串 */
  .thread{border:1.5px solid var(--line); border-radius:16px; padding:12px; margin-bottom:12px;
    background:#fff;}
  .thread .th-meta{font-size:11.5px; color:var(--sub); display:flex; align-items:center; gap:6px; margin-bottom:8px;}
  .thread .th-meta .tt{font-weight:800; color:var(--ink);}
  .tnode{margin-bottom:8px;}
  .tnode:last-child{margin-bottom:0;}
  .tnode .who-line{font-size:11px; font-weight:800; margin-bottom:3px;}
  .tnode.stu .who-line{color:var(--pending);}
  .tnode.coa .who-line{color:var(--ok);}
  .bubble{border-radius:12px; padding:10px 12px; font-size:14.5px; line-height:1.55;
    white-space:pre-wrap; word-break:break-word;}
  .tnode.stu .bubble{background:#f6f0e2; border:1px solid #ead9b0;}
  .tnode.coa .bubble{background:#eef7f1; border:1px solid #cfe8d8;}
  .bubble .dt{font-size:11px; color:var(--sub); margin-top:5px;}
  .empty{color:var(--sub); font-size:14px; text-align:center; padding:16px 0;}
  .foot{margin-top:18px; text-align:center; font-size:11.5px; color:#8fa3b8; letter-spacing:.5px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo" id="brandRow">
      <img id="brandLogo" src="assets/bek_logo.png" alt="BEK">
      <span class="name" id="brandName">BEK RUNNING COACHING</span>
    </div>
    <h1>學員訊息</h1>
    <p>要請假、身體有狀況，或有事想告訴教練，就在這裡寫下訊息。</p>
    <span class="who" id="who">…</span>
  </header>

  <div class="card" id="formCard">
    <h2><span class="dot"></span>寫訊息給教練</h2>
    <div class="label" style="font-size:13px;font-weight:700;color:var(--sub);margin-bottom:8px;">這是什麼事？</div>
    <div class="cats" id="cats">
      <button type="button" class="cat" data-cat="請假" data-sub="受傷">
        <div class="t">請假・受傷</div><div class="s">扭傷、拉傷、身體某處疼痛</div></button>
      <button type="button" class="cat" data-cat="請假" data-sub="生病">
        <div class="t">請假・生病</div><div class="s">感冒、發燒、身體不適</div></button>
      <button type="button" class="cat" data-cat="請假" data-sub="因公">
        <div class="t">請假・因公</div><div class="s">出差、加班、臨時有事</div></button>
      <button type="button" class="cat" data-cat="請假" data-sub="天候">
        <div class="t">請假・天候</div><div class="s">颱風、大雨、天氣不適合</div></button>
      <button type="button" class="cat" data-cat="請假" data-sub="其他">
        <div class="t">請假・其他</div><div class="s">其他無法訓練的原因</div></button>
      <button type="button" class="cat" data-cat="事項" data-sub="一般事項">
        <div class="t">一般事項</div><div class="s">日常回饋、課表感受、器材問題</div></button>
      <button type="button" class="cat" data-cat="事項" data-sub="特別要告訴教練">
        <div class="t">特別要告訴教練</div><div class="s">重要、緊急、想調整課表、報名比賽</div></button>
    </div>

    <!-- 傷病卡（請假・受傷） -->
    <div id="injuryForm" style="display:none;">
      <div class="form-field two">
        <div><label>受傷部位</label>
          <select id="iPart"><option value="">請選擇…</option><option>膝蓋</option><option>腳踝</option><option>大腿</option><option>小腿</option><option>足部</option><option>背部</option><option>髖部</option><option>肩部</option><option>其他</option></select></div>
        <div><label>位置</label>
          <select id="iSide"><option value="">不限</option><option>內側</option><option>外側</option><option>前側</option><option>後側</option><option>上側</option><option>下側</option></select></div>
      </div>
      <div class="form-field two">
        <div><label>類型</label>
          <select id="iKind"><option value="">請選擇…</option><option>疼痛</option><option>扭傷</option><option>拉傷</option><option>腫脹</option><option>麻木</option><option>其他</option></select></div>
        <div><label>可否跑步</label>
          <select id="iCan"><option value="">請選擇…</option><option>可以跑</option><option>不可以跑</option><option>不確定</option></select></div>
      </div>
      <div class="form-field">
        <label>痛感（0 不痛 — 10 最痛）</label>
        <div class="pain-row">
          <input type="range" id="iPain" min="0" max="10" value="5">
          <span class="pv" id="iPainV">5</span>
        </div>
      </div>
      <div class="form-field">
        <label>何時開始／怎麼發生的（選填）</label>
        <input type="text" id="iWhen" placeholder="例如：昨天跑完開始痛">
      </div>
      <div class="form-field">
        <label>想跟教練說的話（選填）</label>
        <textarea id="iNote" placeholder="例如：明天想請假觀察一天"></textarea>
      </div>
    </div>

    <!-- 請假卡（生病/因公/天候/其他） -->
    <div id="leaveForm" style="display:none;">
      <div class="form-field two">
        <div><label>開始日期</label><input type="date" id="lStart"></div>
        <div><label>結束日期（選填）</label><input type="date" id="lEnd"></div>
      </div>
      <div class="form-field">
        <label>說明</label>
        <textarea id="lNote" placeholder="例如：颱風停班停課、感冒發燒、出差"></textarea>
      </div>
    </div>

    <!-- 一般事項 / 特別要告訴教練 -->
    <div id="textForm" style="display:none;">
      <div class="form-field">
        <label>內容</label>
        <textarea id="plainText" placeholder="寫下想告訴教練的事…"></textarea>
      </div>
    </div>

    <button class="send" id="send">送出</button>
    <div class="toast" id="toast"></div>
    <div class="note">送出後，教練會在審查時看到並回覆；你隨時可以回來查看回覆。</div>
  </div>

  <div class="card">
    <h2><span class="dot"></span>我的訊息與教練回覆</h2>
    <div id="history"><div class="empty">載入中…</div></div>
  </div>

  <div class="foot" id="footBrand">BEK RUNNING COACHING</div>
</div>

<script>
(function(){
  var params = new URLSearchParams(location.search);
  var SID = params.get('s') || params.get('sid') || '';
  var KEY = params.get('key') || '';
  var NAMES = {M26001:'王奕翔', M26002:'林洋樂', M26004:'Yumi', M26005:'Stacy', M26006:'蕭克丞', B26001:'Maggie'};
  var API = 'https://script.google.com/macros/s/AKfycbwUchpwx31ZjTyw5wZ5s6KcF4IVnX2vfSd2j9ggA9p1uWF0e_MdYbPFf_TRzGpSSf9R3Q/exec';
  var BRANDS = {
    bek: { logo:'assets/bek_logo.png', name:'BEK RUNNING COACHING' },
    wulixian: { logo:'assets/wulixian_logo.png', name:'無極限 RUNNING CLUB' }
  };

  function applyBrand(brand){
    var b = BRANDS[brand] || BRANDS.bek;
    document.getElementById('brandLogo').src = b.logo;
    document.getElementById('brandName').textContent = b.name;
    document.getElementById('footBrand').textContent = b.name;
  }

  if (!SID || !KEY) {
    document.getElementById('who').textContent = '連結無效';
    document.getElementById('formCard').style.display = 'none';
    document.getElementById('history').innerHTML = '<div class="empty">請使用教練發給你的專屬連結。</div>';
    return;
  }
  document.getElementById('who').textContent = '學員 ' + (NAMES[SID] || SID);
  var formCard = document.getElementById('formCard');

  // 分類選擇 → 顯示對應表單
  var selCat = null, selSub = null;
  var catBtns = document.querySelectorAll('.cat');
  var injuryForm = document.getElementById('injuryForm');
  var leaveForm = document.getElementById('leaveForm');
  var textForm = document.getElementById('textForm');
  function showForm(which){
    injuryForm.style.display = (which === 'injury') ? 'block' : 'none';
    leaveForm.style.display = (which === 'leave') ? 'block' : 'none';
    textForm.style.display = (which === 'text') ? 'block' : 'none';
  }
  catBtns.forEach(function(b){
    b.addEventListener('click', function(){
      selCat = b.dataset.cat; selSub = b.dataset.sub;
      catBtns.forEach(function(x){ x.classList.remove('sel'); });
      b.classList.add('sel');
      if (selCat === '請假' && selSub === '受傷') showForm('injury');
      else if (selCat === '請假') showForm('leave');
      else showForm('text');
    });
  });
  document.getElementById('iPain').addEventListener('input', function(){
    document.getElementById('iPainV').textContent = this.value;
  });

  // 送出
  document.getElementById('send').addEventListener('click', function(){
    var btn = document.getElementById('send');
    if (!selCat) { toast('請先選擇這是什麼事', 'err'); return; }
    var body = {mode:'send', s:SID, key:KEY, cat:selCat, sub:selSub};
    var ok = true;
    if (selCat === '請假' && selSub === '受傷') {
      var part = document.getElementById('iPart').value;
      var side = document.getElementById('iSide').value;
      var kind = document.getElementById('iKind').value;
      var can = document.getElementById('iCan').value;
      if (!part || !kind || !can) { toast('請完成受傷部位、類型、可否跑步', 'err'); return; }
      body.structured = {
        type:'injury', part:part, side:side, kind:kind,
        pain:document.getElementById('iPain').value,
        when:document.getElementById('iWhen').value.trim(),
        canRun:can,
        note:document.getElementById('iNote').value.trim()
      };
      body.text = '受傷通報：' + part + (side?'（'+side+'）':'') + '，' + kind +
        '，痛感' + document.getElementById('iPain').value + '/10，可否跑：' + can +
        (document.getElementById('iWhen').value.trim() ? '，發生：' + document.getElementById('iWhen').value.trim() : '') +
        (document.getElementById('iNote').value.trim() ? '，' + document.getElementById('iNote').value.trim() : '');
    } else if (selCat === '請假') {
      var ds = document.getElementById('lStart').value;
      var de = document.getElementById('lEnd').value;
      var ln = document.getElementById('lNote').value.trim();
      if (!ds && !ln) { toast('請填請假日期或說明', 'err'); return; }
      var dates = ds ? (de ? ds + ' ~ ' + de : ds) : '';
      body.structured = { type:'leave', reason:selSub, dates:dates, note:ln };
      body.text = '請假（' + selSub + '）' + (dates ? '，日期：' + dates : '') + (ln ? '，' + ln : '');
    } else {
      var pt = document.getElementById('plainText').value.trim();
      if (pt.length < 2) { toast('請輸入內容', 'err'); return; }
      body.text = pt;
    }
    btn.disabled = true; btn.textContent = '送出中…';
    fetch(API + '?mode=send', {
      method:'POST',
      mode:'no-cors',
      headers:{'Content-Type':'text/plain;charset=UTF-8'},
      body: JSON.stringify(body)
    }).then(function(){
        btn.disabled = false; btn.textContent = '送出';
        toast('已送出，教練收到囉！', 'ok');
        document.getElementById('plainText').value = '';
        document.getElementById('lNote').value = '';
        document.getElementById('lStart').value = '';
        document.getElementById('lEnd').value = '';
        document.getElementById('iNote').value = '';
        document.getElementById('iWhen').value = '';
        catBtns.forEach(function(x){ x.classList.remove('sel'); });
        selCat = selSub = null;
        showForm('text');
        loadHistory();
      })
      .catch(function(){ btn.disabled = false; btn.textContent = '送出'; toast('網路連線失敗，請再試一次', 'err'); });
  });

  function toast(msg, kind){
    var t = document.getElementById('toast');
    t.className = 'toast ' + kind;
    t.textContent = msg;
    setTimeout(function(){ t.className = 'toast'; }, 4000);
  }

  function esc(s){
    var d=document.createElement('div'); d.textContent = (s==null?'':String(s)); return d.innerHTML;
  }

  // 歷史（對話串分組顯示）
  function loadHistory(){
    var box = document.getElementById('history');
    fetch(API + '?mode=history&s=' + encodeURIComponent(SID) + '&key=' + encodeURIComponent(KEY))
      .then(function(r){ return r.json(); })
      .then(function(j){
        if (!j.ok) { box.innerHTML = '<div class="empty">無法讀取訊息。</div>'; return; }
        if (j.brand) applyBrand(j.brand);
        var list = j.messages || [];
        if (!list.length) { box.innerHTML = '<div class="empty">還沒有訊息紀錄。</div>'; return; }
        // 依 thread 分組（無 thread 的每則獨立）
        var groups = [];
        var map = {};
        list.forEach(function(m){
          var t = m.thread || ('none_' + groups.length);
          if (!map[t]) { map[t] = []; groups.push(map[t]); }
          map[t].push(m);
        });
        box.innerHTML = groups.map(function(g, gi){
          var nodes = g.map(function(m){
            var whoLine = '<div class="who-line">學員</div>';
            var bubbles = '<div class="bubble">' + esc(m.text)
              + '<div class="dt">' + esc(m.date) + ' · ' + esc(m.category) + '</div></div>';
            if (m.reply && m.status === '已回覆') {
              bubbles += '<div class="who-line" style="margin-top:8px;">教練</div>'
                + '<div class="bubble">' + esc(m.reply)
                + (m.replyDate ? '<div class="dt">' + esc(m.replyDate) + '</div>' : '') + '</div>';
            }
            return '<div class="tnode stu">' + whoLine + bubbles + '</div>';
          }).join('');
          return '<div class="thread"><div class="th-meta"><span class="tt">對話</span><span>' +
            (gi + 1) + '</span></div>' + nodes + '</div>';
        }).join('');
      })
      .catch(function(){ box.innerHTML = '<div class="empty">載入失敗，請稍後再試。</div>'; });
  }

  loadHistory();
  // 每 20 秒自動刷新回覆
  setInterval(loadHistory, 20000);
})();
</script>
</body>
</html>
